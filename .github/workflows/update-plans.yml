name: Update Data & Deploy

on:
  schedule:
    # Run every Monday and Thursday at 6 AM IST (00:30 UTC)
    - cron: '30 0 * * 1,4'
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [main]

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # ── Scrape latest data ────────────────────────────
      - name: Scrape mobile plans
        run: node scripts/update-plans.mjs

      - name: Scrape phone specs
        run: node scripts/update-phones.mjs

      - name: Scrape loan rates
        run: node scripts/update-loans.mjs

      - name: Scrape broadband plans
        run: node scripts/update-broadband.mjs

      - name: Scrape gold & silver prices
        run: node scripts/update-gold.mjs

      # ── Commit if data changed ────────────────────────
      - name: Check for data changes
        id: changes
        run: |
          git diff --quiet src/data/ src/pages/tools/gold-silver-price.astro && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ src/pages/tools/gold-silver-price.astro
          git commit -m "chore: auto-update all data

          Scraped latest mobile plans, phone specs, loan rates, broadband plans, and gold/silver prices.

          Generated with [Devin](https://devin.ai)

          Co-Authored-By: Devin <158243242+devin-ai-integration[bot]@users.noreply.github.com>"
          git push

      # ── Build ─────────────────────────────────────────
      - name: Build site
        run: npm run build

      # ── Deploy to Cloudflare Pages ────────────────────
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/client --project-name=comparekaro
